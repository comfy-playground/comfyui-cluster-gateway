version: 1
listen:
  host: 0.0.0.0
  port: 19189

database_path: /data/gateway.sqlite
output_directory: /data/outputs

workers:
  - id: a3000-control
    url: http://host.docker.internal:18188
    expected_device_name: "cuda:0 NVIDIA RTX A3000 Laptop GPU : cudaMallocAsync"
    seconds_per_image: 26.6
    capabilities: [default, fast-sdxl]
    required: true
    primary: true
    enabled: true
  - id: rtx3090-worker
    url: http://host.docker.internal:18201
    expected_device_name: "cuda:0 NVIDIA GeForce RTX 3090 : cudaMallocAsync"
    seconds_per_image: 12.0
    capabilities: [default, fast-sdxl]
    required: false
    primary: false
    enabled: true

timeouts:
  worker_request_ms: 15000
  history_poll_ms: 500
  max_job_runtime_ms: 900000
  catalog_drain_ms: 120000

limits:
  max_prompt_bytes: 8388608
  max_output_bytes: 67108864
  max_outputs_per_job: 64
  max_queued_jobs: 200

scheduler:
  ewma_alpha: 0.25
  ewma_min_samples: 10
  aging_seconds: 30
  tie_epsilon_ms: 500

catalog:
  refresh_on_start: true
  retry_ms: 10000
  page_size: 100

retention:
  max_age_hours: 168
  max_total_bytes: 53687091200
  min_age_hours: 1
  sweep_interval_ms: 3600000

auth:
  generation_token_env: ""
  management_token_env: ""
