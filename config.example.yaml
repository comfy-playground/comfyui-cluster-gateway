version: 1
listen:
  host: 0.0.0.0
  port: 19189

database_path: /data/gateway.sqlite
output_directory: /data/outputs

workers:
  # Replace the URL and exact device name with values from this worker's
  # GET /system_stats response. Each upstream must expose exactly one GPU.
  - id: primary
    url: http://host.docker.internal:8188
    expected_device_name: "cuda:0 REPLACE_WITH_THE_EXACT_COMFYUI_DEVICE_NAME"
    seconds_per_image: 30
    capabilities: [default]
    required: true
    primary: true
    enabled: true
    # Optional warm-model scheduling hint; it never eagerly loads a model.
    # preferred_model_id: legacy
    # legacy_priority: 100
    # Explicit model assignment is required when `models` is configured.
    # model_ids: [anima-base-v1]

models: []
# A model is a complete, exact loader dependency set. To configure one,
# replace [] with the following block and adapt the files:
# models:
#   - id: moody-krea-v7-fp8
#     family: krea2
#     diffusion: Moody-Krea-Mix-v7_00002__clean_fp8.safetensors
#     text_encoder: qwen3vl_4b_fp8_scaled.safetensors
#     vae: qwen_image_vae.safetensors
#     capabilities: [default]
#     max_batch_size: 1

timeouts:
  worker_request_ms: 15000
  history_poll_ms: 500
  max_job_runtime_ms: 900000
  catalog_drain_ms: 120000

limits:
  max_prompt_bytes: 8388608
  max_output_bytes: 67108864
  max_outputs_per_job: 64
  max_queued_jobs: 200

scheduler:
  ewma_alpha: 0.25
  ewma_min_samples: 10
  aging_seconds: 30
  tie_epsilon_ms: 500

batching:
  enabled: false
  merge_window_ms: 20
  adapters:
    sdxl-euler-normal: true
    anima-euler-sgm: true
    anima-er-sde: true
  workers:
    primary:
      default: 2

catalog:
  refresh_on_start: true
  retry_ms: 10000
  page_size: 100

retention:
  max_age_hours: 168
  max_total_bytes: 53687091200
  min_age_hours: 1
  sweep_interval_ms: 3600000

auth:
  generation_token_env: ""
  management_token_env: ""
